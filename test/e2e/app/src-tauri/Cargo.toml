[package]
name = "sentry-tauri-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sadness-generator = "0.6"
sentry = "0.49"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-sentry = { path = "../../../.." }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
