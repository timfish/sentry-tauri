[package]
description = "An experimental Tauri Plugin for Sentry"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "tauri-plugin-sentry"
readme = "README.md"
repository = "https://github.com/timfish/sentry-tauri"
version = "0.8.0"
links = "tauri-plugin-sentry"
exclude = ["/examples", "/node_modules", "/target", "/test"]

[features]
default = ["minidump", "wry", "webview-crashes"]
minidump = ["sentry/minidump"]
wry = ["tauri/wry"]
webview-crashes = [
  "wry",
  "sentry/release-health",
  "dep:webview2-com",
  "dep:windows-core",
  "dep:webkit2gtk",
]

[dependencies]
base64 = "0.23"
sentry = { version = "0.49", default-features = false }
serde = "1"
serde_json = "1"
tauri = { version = "2.12", default-features = false }
thiserror = "2"
schemars = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
] }
# These versions must match the versions that tauri uses.
webview2-com = { version = "0.39", optional = true }
windows-core = { version = "0.62", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "2", features = ["v2_20"], optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
sentry = { version = "0.49", default-features = false, features = ["test"] }
